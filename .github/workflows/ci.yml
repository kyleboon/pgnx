# Continuous integration: runs on every push to main and every pull request.
# It executes `mise run ci`, the same command a developer or agent runs
# locally, on all three release operating systems, then builds a full
# snapshot release on Linux to prove .goreleaser.yaml still produces every
# artifact. Nothing here publishes anything; releasing is a human act (push
# a v* tag, see release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
      - run: mise run ci

  snapshot:
    name: snapshot release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs tags and history for versions and changelog
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true
      - run: mise run snapshot
        env:
          # Only referenced by the cask template; never used in a snapshot.
          HOMEBREW_TAP_TOKEN: unused
      - name: Keep snapshot archives for inspection (main only)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgnx-snapshot-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/homebrew/
          retention-days: 7
