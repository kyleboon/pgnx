# Release: triggered only by a human pushing a semver tag (v1.2.3 or
# v1.2.3-rc1). Builds every target with GoReleaser, publishes a GitHub
# Release with archives and checksums.txt, and updates the Homebrew cask in
# kyleboon/homebrew-tap (skipped for pre-release tags).
#
# A tag whose commit is not on main is refused: releases come from main.
# See docs/adr/0001-release-via-tag-push-and-homebrew-tap.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: changelog since previous tag, and the main check below

      - name: Refuse a tag that is not on main
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not reachable from origin/main. Releases are cut from main only; delete the tag, merge, and re-tag." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main."

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: true

      - run: mise run ci

      - name: GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on kyleboon/homebrew-tap only.
          # Created by a human; see scripts/release-setup-wizard.sh.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
